name = "bank-core360-proxy"
main = "src/index.ts"
compatibility_date = "2026-10-01"
workers_dev = true

[vars]
ALLOWED_ORIGINS = "https://calvintirrell.github.io,http://localhost:5173,http://localhost:4173"
ALLOWED_MODELS = "claude-opus-5-5,claude-sonnet-5-5"
MAX_TOKENS_CAP = "4096"
DAILY_CAP = "300"

# Per-IP rate limit: 10 requests per 60 s (free plan binding).
[[unsafe.bindings]]
name = "RATE_LIMITER"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 10, period = 60 }

# Daily request counter (KV free tier). id is filled in by `wrangler kv namespace create USAGE`.
[[kv_namespaces]]
binding = "USAGE"
id = "bc2f476d010d4d7fa0ce6fa9e0ce167d"
