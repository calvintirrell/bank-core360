name = "bank-core360-proxy"
main = "src/index.ts"
compatibility_date = "2026-10-01"
workers_dev = true

[vars]
ALLOWED_ORIGINS = "https://calvintirrell.github.io,http://localhost:5173,http://localhost:4173"
ALLOWED_MODELS = "claude-opus-5-5,claude-sonnet-5-5"
MAX_TOKENS_CAP = "2048"
# Caps are counted in QUESTIONS (the browser tags every call of one question with the same
# x-demo-question id); a question may use up to CALLS_PER_QUESTION API calls.
DAILY_CAP = "8"
MONTHLY_CAP = "240"
CALLS_PER_QUESTION = "5"
# The only system prompts accepted are the ones the site serves (every as-of version's agent_prompt.md).
PROMPT_SOURCE = "https://calvintirrell.github.io/bank-core360/data"
# anthropic-beta values allowed through (comma-separated); empty = the header is dropped.
ALLOWED_BETAS = ""

# Per-IP rate limit: 12 requests per 60 s (burst protection; the question caps do the real limiting).
[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 12, period = 60 }

# Usage counters + kill switch (KV free tier). Disable instantly with:
#   pnpm exec wrangler kv key put --binding USAGE disabled 1 --remote
# Re-enable with:
#   pnpm exec wrangler kv key delete --binding USAGE disabled --remote
# (the id below was filled in by `wrangler kv namespace create USAGE`)
[[kv_namespaces]]
binding = "USAGE"
id = "bc2f476d010d4d7fa0ce6fa9e0ce167d"
