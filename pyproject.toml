[project]
name = "bank-core360"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.13.0",
    "deltalake>=1.6.6",
    "duckdb>=1.5.6",
    "faker>=40.43.0",
    "polars>=2.0.0",
    "pyarrow>=26.0.0",
    "rapidfuzz>=3.14.6",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 140
target-version = "py312"
