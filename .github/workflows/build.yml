name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  pipeline:
    name: pipeline (bronze -> silver -> gold -> export)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run python -m pipeline
      - run: uv run pytest -q
        if: hashFiles('tests/**/*.py') != ''
      - name: commit lakehouse outputs (only if bytes changed)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lakehouse
          if git diff --cached --quiet; then
            echo "lakehouse unchanged"
          else
            git commit -m "data: rebuild lakehouse from ${GITHUB_SHA::7} [skip ci]"
            git push
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: lakehouse-export
          path: lakehouse/export

  site:
    name: build site
    needs: pipeline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: lakehouse-export
          path: lakehouse/export
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: site/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: site
      - run: pnpm build
        working-directory: site
        env:
          BUILD_RUN_NUMBER: ${{ github.run_number }}
          BUILD_SHA: ${{ github.sha }}
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    name: deploy to GitHub Pages
    needs: site
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
